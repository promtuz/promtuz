[package]
name = "core"
version = "0.1.0"
edition = "2024"
description = "Client library — identity, encryption, networking (Android JNI)"
license.workspace = true
repository.workspace = true

[lib]
# Crate is named `core`, so rustdoc's doctest harness resolves `::core` to us.
doctest = false
# `rlib` alongside `cdylib` so libcore is linkable as a regular Rust
# library (in-tree tests, future iOS static build). The Android cdylib
# build is unaffected — `cargo build` emits both artifacts.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Workspace Crates
common = { path = "../common", features = ["crypto", "proto"] }

# Shared
anyhow.workspace = true
quinn.workspace = true
tokio.workspace = true
rustls.workspace = true
serde.workspace = true
ed25519-dalek = { workspace = true, features = ["zeroize"] }
rand.workspace = true
hex.workspace = true
log.workspace = true
serde_bytes.workspace = true

# Public Crates
android_logger = "0.15.1"
# TODO: bumping to latest version causes "the trait `ToSql` is not implemented for `u64`"
rusqlite = { version = "0.37.0", features = ["bundled", "hooks"] }
parking_lot = { version = "0.12.5", features = ["arc_lock"] }
rusqlite_migration = "2.3.0"
ulid = { version = "1.2.1", features = ["serde"] }
unicode-normalization = "0.1.25"
ciborium = "0.2.2"
if-addrs = "0.15.0"
tokio-util = { version = "0.7.18", features = ["rt"] }
thiserror = "2.0.18"
uuid = { version = "1.23.4", features = ["v7"] }
zeroize = { version = "1.9.0", features = ["aarch64", "derive"] }
# Recovery (IDENTITY_RECOVERY.md): phrase = BIP39(isk), 24 words.
bip39 = "2.2.0"
# Backup blob (IDENTITY_RECOVERY.md §4). All three already in the dep
# tree transitively — direct lines pull zero new code. lz4 over zstd on
# purpose: pure Rust, no C toolchain in the NDK build.
chacha20poly1305 = "0.10.1"
hkdf = "0.13.0"
# Existing MLS HPKE implementation, also used for encrypted contact requests.
hpke-rs = "0.6.1"
hpke-rs-crypto = "0.6.1"
hpke-rs-rust-crypto = "0.6.1"
lz4_flex = "0.11.6"
postcard = { version = "1.1.3", features = ["alloc"] }
x509-parser = "0.18.1"
# HTTPS downloads of encrypted sticker objects.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
# Still-image pipeline (FILE_TRANSFER.md): RGBA→AVIF + blurred thumb.
# `image` decoders off — the platform supplies decoded RGBA pixels.
image = { version = "0.25", default-features = false }
# `threading` = parallel encode (rayon). Base dep skips `asm` so x86_64
# (emulator, CI) never needs nasm; aarch64 layers it on below.
ravif = { version = "0.11", default-features = false, features = ["threading"] }
# ravif's pixel types; `FromSlice` casts &[u8]→&[RGBA8] copy-free. Already
# in the tree via ravif — direct line pulls zero new code.
rgb = "0.8"

# MLS (RFC 9420) — see misc/specs/MLS.md
openmls = "0.8.1"
openmls_traits = "0.5.0"
openmls_rust_crypto = "0.5.1"
openmls_basic_credential = "0.5.0"
tls_codec = "0.4.2"
# RFC 9420 §5.2 mandates `KeyPackageRef = SHA-256(tls_encode(KP))[..32]`
# for cipher suite 0x0003. Direct dep so the KP-ref computation in
# `mls::keypackage` doesn't have to indirect through `common`.
base64.workspace = true
sha2 = "0.11.0"
# Phase 4: direct dep so the MLS messaging path's `mint_group_id` and
# the dispatch_id derivation can hash without indirecting through
# `common::crypto`. Already in the dep tree transitively via `common`;
# this just makes the line item explicit. No new crate added.
blake3 = "1.8.5"
uniffi = { version = "0.31.2", default-features = false, features = ["tokio"] }

# Calls (CALLS.md): the WebRTC stack (ICE, DTLS-SRTP, RTP, SCTP) on the
# aws-lc-rs crypto the tree already builds; Opus through libopus; the TURN
# client and the STUN helpers behind the relayed and reflexive candidates.
# `webrtc-util` only names the socket trait the TURN client hands back.
str0m = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
opus = "0.4"
turn = "0.17"
stun = "0.17"
webrtc-util = "0.17"

# aarch64 (real phones) gets rav1e's NEON asm; it builds with `cc` from the
# NDK, not nasm (nasm is x86-only). Cargo unions this with the base dep.
[target.'cfg(target_arch = "aarch64")'.dependencies]
ravif = { version = "0.11", default-features = false, features = ["threading", "asm"] }

# openmls `test-utils` gates `MlsMessageOut::into_welcome()`, which the fixtures need.
[dev-dependencies]
rcgen = "0.14.8"
openmls = { version = "0.8.1", features = ["test-utils"] }
tokio = { workspace = true, features = ["full", "test-util"] }
x509-parser = "0.18.1"
tempfile = "3"
expect-test = "1.5.1"
