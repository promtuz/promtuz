[package]
name = "common"
version = "0.1.0"
edition = "2024"
description = "Shared library — crypto, protocols, QUIC config, identity"
license.workspace = true
repository.workspace = true

[features]
contracts = ["types", "dep:blake3"]
crypto = [
  "dep:rand",
  "dep:hkdf",
  "dep:ed25519-dalek",
  "dep:sha2",
  "dep:zeroize",
]
# Deployed integration bundle. New consumers select the narrower wire feature
# when they only need serialized contracts, signing transcripts, and framing.
proto = ["wire", "quic", "sysutils"]
wire = ["contracts", "identifiers", "tokio"]
identifiers = ["types", "dep:blake3", "dep:data-encoding"]
quic = [
  "identifiers",
  "tokio",
  "dep:rustls",
  "dep:ed25519-dalek",
  "dep:rustls-pemfile",
  "dep:tokio-rustls",
  "dep:tokio-util",
  "dep:quinn",
  "dep:blake3",
  "dep:data-encoding",
  "dep:base64",
  "macros",
  "node",
]
sysutils = ["dep:sysinfo", "tokio"]
tokio = ["dep:tokio"]
macros = []
certgen = ["quic", "crypto", "dep:rcgen", "dep:clap", "dep:time"]
node = []
types = []
# The daemons: relay, resolver, gateway.
server = ["proto", "crypto", "dep:notify", "dep:governor"]

[[bin]]
name = "certgen"
path = "src/bin/certgen.rs"
required-features = ["certgen"]

[dependencies]
hex.workspace = true
toml.workspace = true
serde.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde_bytes.workspace = true
quinn = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, features = ["pkcs8", "pem", "zeroize"], optional = true }
rustls-pemfile = { workspace = true, optional = true }
tokio-rustls = { version = "0.26.4", optional = true, default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
tokio-util = { version = "0.7.18", optional = true, features = ["rt"] }
tokio = { workspace = true, features = ["io-util", "time", "net", "sync", "macros", "rt"], optional = true }
rand = { workspace = true, optional = true }

blake3 = { version = "1.8.5", optional = true }
data-encoding = { version = "2.11.0", optional = true }
hkdf = { version = "0.13.0", optional = true }
sha2 = { version = "0.11.0", optional = true }
zeroize = { workspace = true, optional = true }
rcgen = { version = "0.14.8", features = ["x509-parser"], optional = true }
# certgen only, for the CA's validity window. Already in the tree via rcgen.
time = { version = "0.3", optional = true }
base64 = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
governor = { version = "0.10.4", optional = true }
clap = { workspace = true, optional = true }
bitflags = "2.13"
sysinfo = { version = "0.39.5", optional = true }
serde_with = "3.21.0"
postcard = { version = "1.1.3", features = ["alloc", "postcard-derive"] }

# Plain `cargo test -p common` builds with the features the transcript vectors need.
[dev-dependencies]
common = { path = ".", features = ["proto", "crypto", "server"] }
expect-test = "1.5.1"
tokio = { workspace = true, features = ["test-util"] }
